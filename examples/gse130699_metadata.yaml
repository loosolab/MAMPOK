project:
  id: gse130699
  project_name: Single nucleus RNA-seq of cardiomyocytes from neonatal mouse hearts
    after injury
  date: 15.01.2025
  description: We performed myocardial infarction (MI) or sham surgeries to mouse
    hearts at postnatal day 1 or day 8. At 1d and 3d post P1 and P8 surgery, ventricle
    samples below the surgery plane were collected for single nucleus RNA-Seq.
  publication:
  - pubmed_id: 32220304
    title: Dynamic Transcriptional Responses to Injury of Regenerative and Non-regenerative
      Cardiomyocytes Revealed by Single-Nucleus RNA Sequencing.
    year: 2020
    author:
    - Cui M
    - Wang Z
    - Chen K
    - et. al
    journal: Dev Cell
    volume: 53
    issue: 1
    pages: 102-116.e8
    doi: 10.1016/j.devcel.2020.02.019
  owner:
    name: Mustermann, Max
    ldap_name: mmuster
    department: AG-mustermann
    email: max.mustermann@example.org
